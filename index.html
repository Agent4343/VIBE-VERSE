<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a2e">
    <meta name="screen-orientation" content="landscape">

    <title>Cosmic Cadet Academy</title>
    <meta name="description" content="Adventure through space and learn along the way! A puzzle-adventure game for kids aged 10-14.">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/ui/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/ui/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/ui/apple-touch-icon.png">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0a2e;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        #game-container canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        /* Initial loading screen */
        #initial-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 100%);
            z-index: 9999;
        }

        #initial-loader.hidden {
            display: none;
        }

        .loader-title {
            color: #00ffff;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            padding: 0 20px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #00ffff;
        }

        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 255, 255, 0.3);
            border-top: 4px solid #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loader-text {
            color: #aaa;
            font-size: 14px;
            margin-top: 20px;
        }

        .loader-error {
            color: #ff6666;
            font-size: 12px;
            margin-top: 15px;
            text-align: center;
            padding: 0 20px;
            max-width: 300px;
        }

        /* Rotate device message */
        #rotate-message {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 100%);
            z-index: 99999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00ffff;
            text-align: center;
            padding: 20px;
        }

        #rotate-message .rotate-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: rotate-hint 2s ease-in-out infinite;
        }

        #rotate-message .rotate-text {
            font-size: 18px;
            margin-bottom: 10px;
        }

        #rotate-message .rotate-subtext {
            font-size: 14px;
            color: #888;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotate-hint {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        /* Show rotate message on portrait mobile */
        @media screen and (max-width: 900px) and (orientation: portrait) {
            #rotate-message {
                display: flex;
            }
            #game-container {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Rotate device message for portrait mode -->
    <div id="rotate-message">
        <div class="rotate-icon">📱</div>
        <div class="rotate-text">Rotate Your Device</div>
        <div class="rotate-subtext">This game plays best in landscape mode</div>
    </div>

    <!-- Initial loader -->
    <div id="initial-loader">
        <div class="loader-title">COSMIC CADET ACADEMY</div>
        <div class="loader-spinner"></div>
        <div class="loader-text" id="loader-status">Loading game...</div>
        <div class="loader-error" id="loader-error"></div>
    </div>

    <!-- Phaser game container -->
    <div id="game-container"></div>

    <!-- Error handling - must be before game script -->
    <script>
        window.onerror = function(msg, url, line, col, error) {
            var errorDiv = document.getElementById('loader-error');
            var statusDiv = document.getElementById('loader-status');
            if (errorDiv) {
                errorDiv.textContent = 'Error: ' + msg;
            }
            if (statusDiv) {
                statusDiv.textContent = 'Failed to load';
            }
            console.error('Game Error:', msg, url, line);
            return false;
        };

        // Update status
        function updateStatus(text) {
            var el = document.getElementById('loader-status');
            if (el) el.textContent = text;
        }

        // Hide loader function - only called when game is ready
        window.hideLoader = function() {
            var loader = document.getElementById('initial-loader');
            if (loader) {
                loader.classList.add('hidden');
            }
        };

        // Try to lock to landscape on mobile
        if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(function() {
                // Orientation lock not supported, that's ok
            });
        }

        updateStatus('Loading scripts...');
    </script>

    <!-- Main game script -->
    <script type="module" src="/src/game/main.js"></script>
</body>
</html>
